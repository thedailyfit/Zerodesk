name: ZeroDesk CI & Production Readiness Suite

on:
  push:
    branches: [main, master, develop, 'codex/**']
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Typecheck, Build, Prisma & Regression Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/zerodesk_ci?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/zerodesk_ci?schema=public"
      NODE_ENV: test
      INTERNAL_VOICE_SECRET: "test-ci-internal-voice-secret-key-32ch"
      JWT_SECRET: "test-ci-jwt-secret-key-32-chars-long"
      CALENDAR_FEED_SECRET: "test-ci-calendar-feed-secret-32-chars"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package before dependent checks
        run: pnpm --filter @zerodesk/shared build

      - name: Validate Prisma Schema
        working-directory: apps/api
        run: |
          npx prisma validate
          npx prisma generate

      - name: Typecheck Backend (apps/api)
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Run Backend Unit & Guard Tests
        working-directory: apps/api
        run: npx jest --verbose

      - name: Typecheck Frontend (apps/web)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Verify tenant boundary and migration guard
        run: |
          node apps/web/scripts/verify-tenant-boundary.cjs
          node scripts/verify-migration-command.cjs
          node scripts/verify-preflight.cjs

      - name: Build API and web
        run: |
          pnpm --filter @zerodesk/api build
          pnpm --filter @zerodesk/web build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
