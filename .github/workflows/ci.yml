name: ZeroDesk CI & Production Readiness Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Prisma & Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/zerodesk_ci?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/zerodesk_ci?schema=public"
      NODE_ENV: test
      INTERNAL_VOICE_SECRET: "test-ci-internal-voice-secret-key-32ch"
      JWT_SECRET: "test-ci-jwt-secret-key-32-chars-long"
      CALENDAR_FEED_SECRET: "test-ci-calendar-feed-secret-32-chars"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        working-directory: apps/api
        run: |
          npx prisma validate
          npx prisma generate

      - name: Typecheck Backend (apps/api)
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Run Backend Unit & Guard Tests
        working-directory: apps/api
        run: npx jest --verbose

      - name: Typecheck Frontend (apps/web)
        working-directory: apps/web
        run: npx tsc --noEmit
