  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #111827;
      --border: #1F2937;
      --border-accent: #374151;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --cyan: #38BDF8;
      --emerald: #10B981;
      --purple: #A855F7;
      --amber: #F59E0B;
      --rose: #F43F5E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284C7, #10B981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: white;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .title-wrap h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-wrap p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .layout {
      display: flex;
      flex: 1;
    }

    /* Sidebar Navigation */
    aside {
      width: 320px;
      border-right: 1px solid var(--border);
      background: #0D1322;
      padding: 24px 16px;
      overflow-y: auto;
      max-height: calc(100vh - 81px);
    }

    .nav-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 18px 12px 8px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .nav-btn.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      font-weight: 600;
    }

    .nav-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      opacity: 0.6;
    }

    /* Main Content Area */
    main {
      flex: 1;
      padding: 36px 48px;
      overflow-y: auto;
      max-height: calc(100vh - 81px);
    }

    .view-header {
      margin-bottom: 28px;
    }

    .badge-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tech-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-accent);
      color: #CBD5E1;
    }

    .view-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .view-desc {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 900px;
    }

    /* Tab Controls */
    .tab-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
    }

    .diagram-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .diagram-panel img,

      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .spec-card {
      background: #0F172A;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .spec-card h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spec-card ul {
      list-style: none;
    }

    .spec-card li {
      font-size: 12px;
      color: #CBD5E1;
      margin-bottom: 8px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .spec-card li::before {
      content: "•";
      color: var(--cyan);
      font-weight: bold;
    }
  </style>
</head>

    let currentViewIndex = 0;
    let currentTab = 'both'; // 'both', 'svg', 'image'

    function loadView(index) {
      currentViewIndex = index;
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
      });

      const data = architectures[index];
      const main = document.getElementById('mainContent');

      let badgesHtml = data.badges.map(b => `<span class="tech-badge">${b}</span>`).join('');
      let cardsHtml = data.cards.map(c => `
        <div class="spec-card">
          <h3>${c.title}</h3>
          <ul>
            ${c.items.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>
      `).join('');

      main.innerHTML = `
        <div class="view-header">
          <div class="badge-row">${badgesHtml}</div>
          <h2 class="view-title">${data.title}</h2>
          <p class="view-desc">${data.desc}</p>
        </div>

        <div class="tab-bar">
          <button class="tab-btn ${currentTab === 'both' ? 'active' : ''}" onclick="setTab('both')">Overview (Both)</button>
          <button class="tab-btn ${currentTab === 'svg' ? 'active' : ''}" onclick="setTab('svg')">Vector Diagram (SVG)</button>
          <button class="tab-btn ${currentTab === 'image' ? 'active' : ''}" onclick="setTab('image')">High-Res Infographic (Image)</button>
        </div>

        ${(currentTab === 'both' || currentTab === 'image') ? `
          <div class="diagram-panel">
            <h4 style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">High-Resolution Architecture Infographic</h4>
            <img src="${data.image}" alt="${data.title}" />
          </div>
        ` : ''}

        ${(currentTab === 'both' || currentTab === 'svg') ? `
          <div class="diagram-panel">
            <h4 style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Precise Technical Vector Blueprint (SVG)</h4>
            <object type="image/svg+xml" data="${data.svg}"></object>
          </div>
        ` : ''}

        <div class="spec-grid">
          ${cardsHtml}
        </div>
      `;
    }

    function setTab(tab) {
      currentTab = tab;
      loadView(currentViewIndex);
    }

    // Initialize View 0 on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadView(0);
    });
  </script>
