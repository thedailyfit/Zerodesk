      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Voice: Priya (Sarvam Indic Hindi/Eng)</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Goal: Book consultation with Dr. Roy</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Fallback: Send WhatsApp summary</text>

