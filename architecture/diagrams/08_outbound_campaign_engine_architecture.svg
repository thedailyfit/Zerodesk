      <text x="10" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Connected: 412 (82.4%)</text>
      <text x="10" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Booked Slots: 142 (34.4%)</text>
      <text x="10" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Transferred: 18</text>

      <rect y="125" width="200" height="110" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">Sentiment Scoring</text>
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Positive: 68%</text>
      <text x="10" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Neutral: 24%</text>
      <text x="10" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Negative / DND: 8%</text>
      <text x="10" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Auto-adds to DND if negative</text>

      <rect y="250" width="200" height="110" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">ROI &amp; Revenue</text>
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Campaign Cost: ₹1,850</text>
      <text x="10" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Pipeline Value: ₹71,000</text>
      <text x="10" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">• ROI: 38.3x</text>
      <text x="10" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#38BDF8">Direct clinic revenue impact</text>
