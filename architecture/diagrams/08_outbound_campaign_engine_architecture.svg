      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Bridges call to doctor mobile</text>
      <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#F59E0B">Warm handoff with context whisper</text>
