      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Patient answers in Hindi / English</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• AI books slot directly via function call</text>
      <text x="12" y="110" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Conversion rate: ~28%</text>

