      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Inactive Patients (&gt;6 months)</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Chronic Care / Diabetic Checkup</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Vaccine / Dental Cleaning Recall</text>

