      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Concurrency limit: 20 lines</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Estimated minutes: 750 mins</text>
