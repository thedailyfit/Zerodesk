  <text x="60" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Targeted Voice Broadcasts, TRAI 9am-9pm IST Gate, Dynamic Concurrency &amp; Live Staff SIP REFER Transfers</text>

