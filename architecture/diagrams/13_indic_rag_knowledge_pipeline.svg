<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ragCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7" />
    </marker>
  </defs>

  <rect width="1400" height="700" fill="url(#bgGrad13)" />

  <text x="60" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">ZEROdesk | Indic RAG Knowledge Ingestion &amp; Grounding Architecture</text>
  <text x="60" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Multilingual Document Ingestion, Unicode Normalization, Supabase pgvector HNSW Search &amp; Clinical Safety Guardrails</text>

  <!-- 4 Horizontal Stages -->
  <!-- Stage 1 -->
  <g transform="translate(60, 130)">
    <rect width="280" height="510" rx="12" fill="url(#ragCard)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="20" y="20" width="110" height="24" rx="6" fill="#0369A1" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#BAE6FD">INGESTION</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8">Clinic Documents</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Multi-format Uploads</text>

    <g transform="translate(18, 105)">
      <rect width="244" height="90" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Source Formats</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Clinical Fee Schedules (PDF)</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Doctor Timings &amp; Bio (DOCX)</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• Treatment FAQs (Markdown/TXT)</text>

      <rect y="105" width="244" height="110" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Document Parser</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">pdf-parse &amp; mammoth</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Cleans headers &amp; footers</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Preserves medical tables &amp; lists</text>
      <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">OCR fallback for scanned pages</text>

      <rect y="230" width="244" height="100" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Tenant Scoping</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">KnowledgeDoc Model</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• tenant_id strictly stamped</text>
      <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Strict clinical data boundary</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 340 380 L 400 380" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-r)" />

  <!-- Stage 2 -->
  <g transform="translate(410, 130)">
    <rect width="280" height="510" rx="12" fill="url(#ragCard)" stroke="#A855F7" stroke-width="1.5" />
    <rect x="20" y="20" width="110" height="24" rx="6" fill="#581C87" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#F3E8FF">PROCESSING</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#C084FC">Indic Chunking</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Unicode &amp; Embeddings</text>

    <g transform="translate(18, 105)">
      <rect width="244" height="100" rx="6" fill="#0F172A" stroke="#7C3AED" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C084FC">Indic Unicode Normalizer</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">NFKC normalization</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Devanagari (Hindi, Marathi)</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Telugu, Tamil, Bengali script</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Zero garbled characters</text>

      <rect y="115" width="244" height="100" rx="6" fill="#0F172A" stroke="#7C3AED" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C084FC">Semantic Chunking</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Chunk size: 500 tokens</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Overlap: 50 tokens</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Keeps treatment rows contiguous</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Zero split sentences</text>

      <rect y="230" width="244" height="100" rx="6" fill="#0F172A" stroke="#7C3AED" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C084FC">OpenAI Embeddings</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">text-embedding-3-small</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 1536-dimension float vector</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Multi-language semantic align</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Fast, low-cost vector model</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 690 380 L 750 380" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-r)" />

  <!-- Stage 3 -->
  <g transform="translate(760, 130)">
    <rect width="280" height="510" rx="12" fill="url(#ragCard)" stroke="#10B981" stroke-width="1.5" />
    <rect x="20" y="20" width="110" height="24" rx="6" fill="#064E3B" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#A7F3D0">STORAGE</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#10B981">pgvector HNSW</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Supabase Mumbai DB</text>

    <g transform="translate(18, 105)">
      <rect width="244" height="110" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">HNSW Indexing</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Hierarchical Navigable Small World</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• m = 16, ef_construction = 64</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 10x faster than IVFFlat</text>
      <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Query latency: &lt;18ms</text>

      <rect y="125" width="244" height="110" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">Hybrid Query Search</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Cosine Distance &lt;=&gt; + ILIKE</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Semantic similarity: Top 4 chunks</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Keyword boost for doctor names</text>
      <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">High precision retrieval</text>

      <rect y="250" width="244" height="85" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">Chunk Cache in Redis</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Top 10 frequent questions</text>
      <text x="12" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">0ms database hit for common FAQs</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 1040 380 L 1100 380" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-r)" />

  <!-- Stage 4 -->
  <g transform="translate(1110, 130)">
    <rect width="230" height="510" rx="12" fill="url(#ragCard)" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="20" y="20" width="110" height="24" rx="6" fill="#78350F" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FDE68A">GUARDRAIL</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F59E0B">Clinical Prompt</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Safety &amp; Compliance</text>

    <g transform="translate(15, 105)">
      <rect width="200" height="110" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Prompt Injection Guard</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Filters malicious patterns:</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• "Ignore all previous instructions"</text>
      <text x="10" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• "Give me admin credentials"</text>
      <text x="10" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Auto-rejects prompt attacks</text>

      <rect y="125" width="200" height="110" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Medical Scope Boundary</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Strict clinical rules:</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• No autonomous diagnoses</text>
      <text x="10" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• No prescription drugs suggested</text>
      <text x="10" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Refers patient to doctor</text>

      <rect y="250" width="200" height="85" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Emergency Intercept</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Chest pain / bleeding</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#EF4444">Urges dial 108 / nearest ER</text>
    </g>
  </g>
</svg>
