<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07120D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="waCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>
    <marker id="arrow-green5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#22C55E" />
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad5)" />

  <!-- Header -->
  <text x="60" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">ZEROdesk | WhatsApp Omnichannel &amp; Conversational Booking Architecture</text>
  <text x="60" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Meta Cloud API (v21.0), Cryptographic HMAC Ingress, Redis Idempotency &amp; ACID Booking Transactions</text>

  <!-- Step 1: Meta Ingress -->
  <g transform="translate(60, 120)">
    <rect width="280" height="720" rx="12" fill="url(#waCard)" stroke="#22C55E" stroke-width="1.5" />
    <rect x="20" y="20" width="120" height="24" rx="6" fill="#15803D" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#DCFCE7">STAGE 1: INGRESS</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#4ADE80">Meta Cloud API</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Graph API v21.0 Webhooks</text>

    <g transform="translate(18, 110)">
      <rect width="244" height="75" rx="6" fill="#064E3B" stroke="#22C55E" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F0FDF4">Inbound Patient Message</text>
      <text x="12" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#BBF7D0">"Book appointment with Dr. Sharma tomorrow 10am"</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#86EFAC">From: +91 98765 43210</text>

      <rect y="90" width="244" height="120" rx="6" fill="#0F172A" stroke="#10B981" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ADE80">Webhook Verification</text>
      <text x="12" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">GET /v1/whatsapp/webhook</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• hub.mode = subscribe</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• hub.challenge echoed back</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• hub.verify_token matched</text>
      <text x="12" y="106" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Live Status: VERIFIED (200 OK)</text>

      <rect y="225" width="244" height="110" rx="6" fill="#0F172A" stroke="#10B981" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ADE80">Event Payload Ingress</text>
      <text x="12" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">POST /v1/whatsapp/webhook</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• entry[0].changes[0].value</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• wamid.HBgL... (Unique ID)</text>
      <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#F59E0B">Header: x-hub-signature-256</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 340 350 L 400 350" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow-green5)" />

  <!-- Step 2: NestJS Security & Idempotency -->
  <g transform="translate(410, 120)">
    <rect width="280" height="720" rx="12" fill="url(#waCard)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#0369A1" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#E0F2FE">STAGE 2: SECURITY</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8">HMAC &amp; Idempotency</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Crypto Verification &amp; Dedup</text>

    <g transform="translate(18, 110)">
      <rect width="244" height="130" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">1. HMAC SHA-256 Guard</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">computeHmac(rawBody, secret)</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• crypto.timingSafeEqual()</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Blocks spoofed webhook calls</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Protects tenant data isolation</text>
      <text x="12" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Constant-time execution</text>

      <rect y="150" width="244" height="140" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">2. Redis Idempotency</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Key: idempotency:wa:{wamid}</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Redis SETNX with 24-hr TTL</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• If exists: Return 200 OK immediately</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Prevents Meta retry storms</text>
      <text x="12" y="106" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Zero duplicate appointment slots</text>
      <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Sub-millisecond Redis check</text>

      <rect y="310" width="244" height="120" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">3. Tenant DID Matcher</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Matches destination phone number</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Resolves tenantId &amp; clinic settings</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Loads clinic doctor rosters</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Checks WhatsApp quota balance</text>
      <text x="12" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Strict multi-tenant boundary</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 690 350 L 750 350" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow-green5)" />

  <!-- Step 3: NLP & Transactional Booking -->
  <g transform="translate(760, 120)">
    <rect width="280" height="720" rx="12" fill="url(#waCard)" stroke="#A855F7" stroke-width="1.5" />
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#581C87" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#F3E8FF">STAGE 3: PROCESSING</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#C084FC">NLP &amp; Transaction</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Intent Parsing &amp; ACID Lock</text>

    <g transform="translate(18, 110)">
      <rect width="244" height="130" rx="6" fill="#0F172A" stroke="#7C3AED" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C084FC">1. Intent &amp; Slot Extraction</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Groq LPU / OpenAI JSON mode</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Intent: BOOK_APPOINTMENT</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Doctor: Dr. Sharma</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Slot: Tomorrow 10:00 AM IST</text>
      <text x="12" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Extraction time: &lt;140ms</text>

      <rect y="150" width="244" height="160" rx="6" fill="#0F172A" stroke="#7C3AED" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C084FC">2. Prisma $transaction</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">IsolationLevel: Serializable</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 1. Find or create Customer</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 2. Lock doctor time window</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 3. Verify slot collision (count == 0)</text>
      <text x="12" y="106" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 4. Create Appointment (CONFIRMED)</text>
      <text x="12" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• 5. Append Conversation &amp; Message</text>
      <text x="12" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Atomic Commit / Rollback</text>

      <rect y="330" width="244" height="90" rx="6" fill="#0F172A" stroke="#7C3AED" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C084FC">3. WebSocket Sync</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Emits to Pro/Starter Web UI</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Event: appointment.created</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Calendar tile refreshes instantly</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 1040 350 L 1100 350" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow-green5)" />

  <!-- Step 4: Outbound Confirmation Dispatch -->
  <g transform="translate(1110, 120)">
    <rect width="230" height="720" rx="12" fill="url(#waCard)" stroke="#22C55E" stroke-width="1.5" />
    <rect x="20" y="20" width="120" height="24" rx="6" fill="#15803D" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#DCFCE7">STAGE 4: OUTBOUND</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#4ADE80">WhatsApp Dispatch</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Meta Template Delivery</text>

    <g transform="translate(18, 110)">
      <rect width="194" height="150" rx="6" fill="#064E3B" stroke="#22C55E" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F0FDF4">Confirmation Template</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#BBF7D0">"Your appointment with Dr. Sharma is booked for tomorrow at 10:00 AM."</text>
      <text x="10" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">📍 Clinic Map Link</text>
      <text x="10" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">💳 UPI Advance Pay</text>
      <text x="10" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">❌ Reschedule / Cancel</text>
      <text x="10" y="138" font-family="system-ui, sans-serif" font-size="9" fill="#86EFAC">Delivered &lt;1.2s</text>

      <rect y="170" width="194" height="120" rx="6" fill="#0F172A" stroke="#10B981" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ADE80">Status Callback Webhook</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Meta delivers status:</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• sent</text>
      <text x="10" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">• delivered (double tick)</text>
      <text x="10" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">• read (blue tick)</text>
      <text x="10" y="106" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Updates message status in DB</text>

      <rect y="310" width="194" height="110" rx="6" fill="#0F172A" stroke="#F59E0B" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">BullMQ Reminder Job</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Queues T - 2 hours:</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">"Reminder: Clinic visit in 2 hrs"</text>
      <text x="10" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Reduces no-shows by 42%</text>
    </g>
  </g>
</svg>
