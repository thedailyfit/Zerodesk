<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="qCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <marker id="arrow-queue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad7)" />

  <!-- Header -->
  <text x="60" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">ZEROdesk | Pro Automations &amp; Distributed BullMQ Queue Architecture</text>
  <text x="60" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">High-Throughput Redis Task Pipelines, Scheduled Patient Recalls, Concurrency Throttling &amp; Dead-Letter Recovery</text>

  <!-- Block 1: Event Producers -->
  <g transform="translate(60, 120)">
    <rect width="280" height="720" rx="12" fill="url(#qCard)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#0369A1" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#BAE6FD">PRODUCER LAYER</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8">Event Dispatchers</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">NestJS Services &amp; Cron Triggers</text>

    <g transform="translate(18, 110)">
      <rect width="244" height="95" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Appointment Completed</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Status: COMPLETED</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Dispatches 6-Month Recall</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Generates GST E-Invoice PDF</text>

      <rect y="110" width="244" height="95" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Voice Call Completed</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Fly.io WebRTC Termination</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Asynchronous Audio Upload to R2</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Generates Call Summary &amp; Sentiment</text>

      <rect y="220" width="244" height="95" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Outbound Campaign Batch</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Doctor Launches Broadcast</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Enqueues 500 patient contacts</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Throttled rate: 25 calls/minute</text>

      <rect y="330" width="244" height="85" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Periodic Cron Scheduler</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">NestJS @Cron('0 9 * * *')</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Morning 9:00 AM IST appointment alerts</text>
      <text x="12" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Zero cron overlap locking</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 340 350 L 400 350" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-queue)" />

  <!-- Block 2: Redis BullMQ Pipelines -->
  <g transform="translate(410, 120)">
    <rect width="320" height="720" rx="12" fill="url(#qCard)" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#78350F" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FDE68A">REDIS BULLMQ</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F59E0B">Queue Pipelines</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Railway In-Memory Redis Cluster</text>

    <g transform="translate(18, 110)">
      <rect width="284" height="75" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Queue: inbound-calls</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Priority: 1 (Highest) • Concurrency: 50</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#34D399">Real-time webhook processing</text>

      <rect y="85" width="284" height="75" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Queue: delayed-recalls</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Delay: 15,552,000,000ms (180 days)</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#38BDF8">Persistent ZSET schedule in Redis</text>

      <rect y="170" width="284" height="75" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Queue: outbound-campaigns</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Rate: 30 jobs / 60,000ms (Limiter)</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#FBBF24">TRAI 9am-9pm IST time filter</text>

      <rect y="255" width="284" height="75" rx="6" fill="#0F172A" stroke="#D97706" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Queue: invoice-pdf</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Headless PDF rendering &amp; GST tax check</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Uploads PDF to Cloudflare R2</text>

      <rect y="340" width="284" height="75" rx="6" fill="#0F172A" stroke="#EF4444" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FCA5A5">Dead-Letter Queue (DLQ)</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">Failed jobs after 5 backoff retries</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#F87171">Alerts Sentry &amp; Superadmin console</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 730 350 L 790 350" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-queue)" />

  <!-- Block 3: Workers & Backoff -->
  <g transform="translate(800, 120)">
    <rect width="280" height="720" rx="12" fill="url(#qCard)" stroke="#10B981" stroke-width="1.5" />
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#064E3B" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#A7F3D0">WORKER ENGINE</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#10B981">BullMQ Processors</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">NestJS @Processor() Handlers</text>

    <g transform="translate(18, 110)">
      <rect width="244" height="125" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">Exponential Backoff Retry</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">attempts: 5</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• backoff: {type:'exponential', delay:1000}</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Attempt 1: 1s, 2: 2s, 3: 4s, 4: 8s, 5: 16s</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Protects against Meta/Plivo downtime</text>
      <text x="12" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#34D399">Zero dropped appointments</text>

      <rect y="135" width="244" height="125" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">Multi-Tenant Job Scoping</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">job.data.tenantId Enforced</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Database queries scoped to clinic</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Uses clinic WhatsApp credentials</text>
      <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Quota decremented atomically</text>
      <text x="12" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#34D399">Strict multi-tenant security</text>

      <rect y="270" width="244" height="110" rx="6" fill="#0F172A" stroke="#059669" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">Graceful Worker Shutdown</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">SIGTERM / SIGINT Interceptor</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Finishes in-flight jobs</text>
      <text x="12" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Re-queues unstarted tasks</text>
      <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#34D399">Zero job data corruption</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 1080 350 L 1140 350" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-queue)" />

  <!-- Block 4: Telemetry & Monitoring -->
  <g transform="translate(1150, 120)">
    <rect width="190" height="720" rx="12" fill="url(#qCard)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="20" y="20" width="100" height="24" rx="6" fill="#0369A1" />
    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#BAE6FD">AUDIT &amp; SYNC</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8">Observability</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Bull-Board &amp; DB</text>

    <g transform="translate(15, 110)">
      <rect width="160" height="120" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Bull-Board UI</text>
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">/admin/queues</text>
      <text x="10" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Active, waiting, failed</text>
      <text x="10" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• One-click retry</text>
      <text x="10" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Superadmin secured</text>

      <rect y="130" width="160" height="110" rx="6" fill="#0F172A" stroke="#0284C7" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Database Audit</text>
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#E2E8F0">AuditLog Model</text>
      <text x="10" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Job execution latency</text>
      <text x="10" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Success/failure rate</text>
      <text x="10" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">100% trace coverage</text>
    </g>
  </g>
</svg>
