[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.4 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @zerodesk/api db:generate",
  "pnpm --filter @zerodesk/api build"
]

[start]
cmd = "pnpm --filter @zerodesk/api start:prod"
